<div style="width:100%; max-width:1200px; margin:0 auto; overflow:hidden; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.15);">
  <iframe 
    id="rvcc-estimator-iframe"
    src="https://your-cloudflare-app.pages.dev" 
    width="100%" 
    height="850px" 
    style="border:none; display:block; width:100%; transition:height 0.2s ease;" 
    allow="camera; microphone; geolocation"
    loading="lazy">
  </iframe>
</div>

<script>
  // Listen for auto-resize messages from the RVCC App iframe
  window.addEventListener('message', function(event) {
    if (event.data && (event.data.height || event.data.type === 'rvcc-resize')) {
      var iframe = document.getElementById('rvcc-estimator-iframe');
      if (iframe && event.data.height) {
        iframe.style.height = event.data.height + 'px';
      }
    }
  });
</script>
